<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Générateur de banques d’oscillogrammes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app">
        <section class="panel" aria-labelledby="title">
            <p class="eyebrow">Outil enseignant</p>
            <h1 id="title">Banques d’oscillogrammes</h1>
            <p class="intro">Générez des séries reproductibles de PNG, classées par difficulté, accompagnées d’un inventaire CSV.</p>

            <form id="generatorForm">
                <div class="counts">
                    <label class="count easy">
                        <span>Easy</span>
                        <small>Valeurs entières, sans composante continue</small>
                        <input id="easyCount" type="number" min="0" max="500" value="50" required>
                    </label>
                    <label class="count medium">
                        <span>Medium</span>
                        <small>Demi-divisions, décalage simple possible</small>
                        <input id="mediumCount" type="number" min="0" max="500" value="100" required>
                    </label>
                    <label class="count hard">
                        <span>Hard</span>
                        <small>Demi-divisions, Umoy non nulle et phase décalée</small>
                        <input id="hardCount" type="number" min="0" max="500" value="50" required>
                    </label>
                </div>

                <label class="seed-field">
                    <span>Graine de la banque</span>
                    <input id="seed" type="text" value="OSCILLO-2026" maxlength="80" required>
                    <small>La même graine et les mêmes quantités reproduisent exactement la même banque.</small>
                </label>

                <button id="generateButton" type="submit">Générer le ZIP</button>
            </form>

            <div id="progressArea" class="progress-area" hidden>
                <div class="progress-copy">
                    <strong id="progressLabel">Préparation…</strong>
                    <span id="progressValue">0 / 200</span>
                </div>
                <progress id="progress" value="0" max="200"></progress>
            </div>

            <p id="status" class="status" role="status" aria-live="polite"></p>
            <p class="note">Aucune donnée n’est envoyée sur Internet. La génération s’effectue entièrement dans le navigateur.</p>
        </section>

        <section class="preview-panel" aria-labelledby="previewTitle">
            <div class="preview-heading">
                <div>
                    <p class="eyebrow">Aperçu</p>
                    <h2 id="previewTitle">Exemple de sortie</h2>
                </div>
                <button id="refreshPreview" class="secondary" type="button">Nouvel aperçu</button>
            </div>
            <canvas id="preview" width="1300" height="896" aria-label="Aperçu d’un oscillogramme"></canvas>
            <dl id="previewData" class="preview-data"></dl>
        </section>
    </main>

    <img id="oscilloscopeImage" src="Oscilloscope.png" alt="" hidden>
    <script src="script.js" defer></script>
</body>
</html>
